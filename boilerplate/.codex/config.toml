# Codex 프로젝트 설정. 팀이 공유할 모델·승인 정책 등을 담고 커밋한다.
#
# 반드시 알아야 할 두 가지
#
# 1. 신뢰(trust) 전에는 이 계층이 통째로 무시된다.
#    프로젝트를 신뢰로 표시하기 전까지 .codex/ 는 읽히지 않는다.
#    clone한 사람이 "설정이 안 먹는다"고 하면 대개 이것이다.
#
# 2. 덮을 수 없는 키가 있다.
#    프로바이더·인증·텔레메트리 관련 키는 레포 설정으로 바꿀 수 없다.
#    클론한 레포가 요청을 다른 엔드포인트로 돌리지 못하게 하는 보안 경계다.
#    그런 설정은 개인 설정에서 각자 관리한다.
#
# 개인 API 키·토큰은 여기에 쓰지 않는다. 애초에 지정할 수 없고, 시도해서도 안 된다.
#
# 채울 것: 실제 키와 값은 팀이 쓰는 Codex 버전의 공식 문서를 확인하고 넣는다.
#          https://learn.chatgpt.com/docs/config-file/config-basic
